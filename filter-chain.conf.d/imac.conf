# iMac 2015 internal speakers on Linux (PipeWire)
#
# Creates a virtual stereo sink named "iMac" that fans each stereo channel
# out to two of the four physical CS4208 speaker channels (aux0-aux3):
#
#     Left  -> aux0 + aux1
#     Right -> aux2 + aux3
#
# Built entirely from PipeWire built-in "copy" nodes (a tee: one input,
# one output, output linkable to many inputs). No external plugins required.
#
# Install:
#   install -Dm644 imac.conf ~/.config/pipewire/filter-chain.conf.d/imac.conf
#
# The filter-chain config runs in its own service, not the main pipewire one:
#   systemctl --user enable --now filter-chain
#
# See the repository README for the full setup and troubleshooting.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "iMac 4-speaker (L->FL+RL, R->FR+RR)"
            media.name       = "iMac"
            filter.graph = {
                nodes = [
                    { name = copyL  type = builtin label = copy }
                    { name = copyR  type = builtin label = copy }
                    { name = copyFL type = builtin label = copy }
                    { name = copyRL type = builtin label = copy }
                    { name = copyFR type = builtin label = copy }
                    { name = copyRR type = builtin label = copy }
                ]
                links = [
                    { output = "copyL:Out" input = "copyFL:In" }   # L -> FL (aux0)
                    { output = "copyL:Out" input = "copyRL:In" }   # L -> RL (aux1)
                    { output = "copyR:Out" input = "copyFR:In" }   # R -> FR (aux2)
                    { output = "copyR:Out" input = "copyRR:In" }   # R -> RR (aux3)
                ]
                inputs  = [ "copyL:In" "copyR:In" ]
                outputs = [ "copyFL:Out" "copyRL:Out" "copyFR:Out" "copyRR:Out" ]
            }
            capture.props = {
                media.class    = "Audio/Sink"
                node.name      = "iMac"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name       = "iMac_master"
                audio.position  = [ FL RL FR RR ]
                stream.dont-remix = true
                node.passive    = true
            }
        }
    }
]
